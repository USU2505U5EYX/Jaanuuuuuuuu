JAANISACUPCAKE<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Janani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff3ee;--bg2:#f4cfcf;--ink:#4a1f33;--soft:#7a4a5e;--card:#fff8f4;--gold1:#f8de8a;--gold2:#d4a02a;--gold3:#8f6210;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#3a1228;--bg2:#14060e;--ink:#fbe9d7;--soft:#e2c3b5;--card:#2b0e1f}}
:root[data-theme="dark"]{--bg1:#3a1228;--bg2:#14060e;--ink:#fbe9d7;--soft:#e2c3b5;--card:#2b0e1f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,var(--bg1),var(--bg2));color:var(--ink);font:300 17px/1.5 "Jost",system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500}
.gold{background:linear-gradient(100deg,var(--gold3),var(--gold1) 40%,var(--gold2) 70%,var(--gold1));-webkit-background-clip:text;background-clip:text;color:transparent}
#stage{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:28px 20px 48px;text-align:center}
#hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;transition:opacity .45s}
#hero.out{opacity:0}
#hero p{margin:0 0 6px;color:var(--soft);font-size:19px}
#hero h1{margin:0 0 36px;font-size:clamp(64px,22vw,104px);line-height:1;padding:0 .1em .08em}
#open{width:150px;height:150px;border:0;background:none;padding:0;cursor:pointer;animation:beat 1.8s ease-in-out infinite;filter:drop-shadow(0 8px 22px rgba(212,160,42,.55))}
#open:focus-visible{outline:2px solid var(--gold2);outline-offset:8px;border-radius:50%}
#open svg{width:100%;height:100%}
#hint{margin-top:22px;font-size:15px;color:var(--soft)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.reveal{display:none}
.go .reveal{display:block}
.head h2{margin:0 0 8px;font-size:clamp(40px,12vw,58px);line-height:1.05}
.head p{margin:0;color:var(--soft);font-size:17px}
.line{opacity:0}
.go .line{animation:rise .9s ease calc(.2s + var(--i) * .4s) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:9px;justify-content:center;margin-top:16px}
.dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold2);transition:all .5s}
.dots i.on{background:var(--gold2);box-shadow:0 0 10px var(--gold1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 10px;margin-top:26px}
.item{background:none;border:0;padding:6px 0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .25s cubic-bezier(.3,1.4,.5,1);touch-action:manipulation}
.item:active{transform:scale(.9)}
@media (hover:hover){.item:hover{transform:scale(1.07)}}
.item:focus-visible{outline:2px solid var(--gold2);outline-offset:6px;border-radius:20px}
.fl{display:block;width:clamp(104px,36vw,150px);opacity:0;filter:drop-shadow(0 8px 12px rgba(80,20,40,.3));transition:filter .6s}
.fl svg{display:block;width:100%;height:auto}
.go .fl{animation:pop .8s cubic-bezier(.2,.9,.3,1.3) var(--d) both,float 4.2s ease-in-out calc(var(--d) + .9s) infinite}
.seen .fl{filter:drop-shadow(0 0 14px rgba(248,222,138,.85))}
.cap{font:italic 500 20px/1.15 "Cormorant Garamond",Georgia,serif;max-width:15ch;opacity:0;color:var(--soft);transition:color .5s}
.go .cap{animation:rise .8s ease calc(var(--d) + .7s) both}
.seen .cap{color:var(--ink)}
@keyframes pop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}}
#sheet{position:fixed;inset:0;z-index:10;visibility:hidden;transition:visibility 0s .55s}
#sheet.on{visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:rgba(20,6,14,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .45s}
.on .scrim{opacity:1}
.card{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--gold2);padding:26px 24px calc(26px + env(safe-area-inset-bottom,0px));text-align:center;box-shadow:0 -10px 50px rgba(212,160,42,.3);transform:translateY(105%);transition:transform .55s cubic-bezier(.2,.9,.25,1.05)}
.on .card{transform:none}
.cico{width:116px;margin:-84px auto 8px}
.cico svg{display:block;width:100%;height:auto;animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both;filter:drop-shadow(0 0 16px rgba(248,222,138,.8))}
.card h3{margin:0 0 10px;font-size:34px;line-height:1.1;animation:rise .6s ease both}
.card p{margin:0 auto;max-width:36ch;font-size:18px;line-height:1.6;animation:rise .7s ease .1s both}
.acts{display:flex;gap:8px;justify-content:center;margin-top:22px}
.btn{font:400 16px "Jost",system-ui,sans-serif;border:0;border-radius:99px;padding:13px 28px;cursor:pointer;background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#4a1f33;box-shadow:0 6px 20px rgba(212,160,42,.4);transition:transform .2s}
.btn:active{transform:scale(.94)}
.ghost{background:none;box-shadow:none;color:var(--soft)}
#finale{display:none;padding:64px 0 24px;min-height:80vh}
#finale.on{display:block}
.fx{opacity:0}
#finale.on .fx{animation:rise .9s ease var(--t) both}
#finale p{margin:0 0 8px}
.sig{position:relative;display:inline-block;margin-top:18px;font-family:"Mrs Saint Delafield","Cormorant Garamond",cursive;font-size:clamp(56px,17vw,92px);line-height:1.3;white-space:nowrap;filter:drop-shadow(0 0 6px rgba(248,222,138,.5))}
.ink{display:inline-block;padding:0 .12em;clip-path:inset(-20% 100% -20% 0)}
.sig.go{animation:glow 2.4s ease-in-out 3.4s infinite alternate}
.sig.go .ink{animation:wipe 3.4s cubic-bezier(.45,.05,.4,1) forwards}
.pen{position:absolute;top:58%;left:0;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff6c8;box-shadow:0 0 14px 6px var(--gold1);opacity:0}
.sig.go .pen{animation:pen 3.4s cubic-bezier(.45,.05,.4,1) forwards}
@keyframes wipe{to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes pen{0%{left:0;opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
@keyframes glow{to{filter:drop-shadow(0 0 16px rgba(248,222,138,.95))}}
.under{display:block;width:min(260px,70%);margin:-8px auto 30px;overflow:visible}
.under path{fill:none;stroke:var(--gold2);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 4px var(--gold1))}
.sig.go+.under path{animation:draw 1s ease 3.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#finale h3{margin:0 0 6px;font-size:clamp(44px,13vw,64px);line-height:1}
.code{display:inline-flex;align-items:center;gap:12px;margin:14px 0 8px;padding:8px 8px 8px 22px;border:1px solid var(--gold2);border-radius:99px;background:rgba(212,160,42,.1);box-shadow:0 0 26px rgba(212,160,42,.28)}
#word{font-weight:400;letter-spacing:.1em;font-size:clamp(13px,4vw,18px);-webkit-user-select:all;user-select:all}
#st{min-height:1.5em;color:var(--soft);font-size:15px}
#layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fall{position:absolute;top:-50px;animation:fall linear forwards;filter:drop-shadow(0 0 6px rgba(248,222,138,.7))}
.fall svg{width:100%;height:100%;display:block}
@keyframes fall{to{transform:translate(var(--sway),110vh) rotate(var(--rot))}}
@media (prefers-reduced-motion: reduce){#open,.go .fl{animation-duration:.01s}.sig.go .ink,.sig.go .pen{animation-duration:.01s}.fall{animation-duration:9s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8de8a"/><stop offset=".5" stop-color="#d4a02a"/><stop offset="1" stop-color="#8f6210"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec8aa0"/><stop offset="1" stop-color="#a82a48"/></linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3cdb0"/><stop offset="1" stop-color="#d9976f"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f9fc"/><stop offset="1" stop-color="#b9cfdd"/></linearGradient>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="url(#g)"/></symbol>
  </defs>
</svg>
<div id="layer"></div>

<main id="stage">
  <section id="hero">
    <p class="serif">for</p>
    <h1 class="serif gold">Janani</h1>
    <button id="open" aria-label="Open your surprise"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></button>
    <div id="hint">tap the heart</div>
  </section>

  <section class="reveal">
    <header class="head">
      <h2 class="serif line" style="--i:0">You glow, Janani.</h2>
      <p class="line" style="--i:1">Six small reasons. Tap each one.</p>
      <div class="dots line" style="--i:2" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </header>
    <div class="grid">
      <button class="item" style="--d:.1s"><span class="fl"><svg viewBox="0 0 64 64"><path d="M24 32V17l11-9q5 2 5 7v17z" fill="url(#r)"/><rect x="20" y="30" width="24" height="9" rx="2" fill="url(#g)"/><rect x="22" y="38" width="20" height="21" rx="2" fill="url(#g)" opacity=".92"/></svg></span><span class="cap"></span></button>
      <button class="item" style="--d:.25s"><span class="fl"><svg viewBox="0 0 64 64"><rect x="22" y="5" width="20" height="9" rx="2" fill="url(#g)"/><rect x="29" y="13" width="6" height="9" fill="url(#g)"/><rect x="15" y="22" width="34" height="38" rx="9" fill="url(#n)"/><rect x="22" y="31" width="20" height="17" rx="3" fill="#fff" opacity=".4"/></svg></span><span class="cap"></span></button>
      <button class="item" style="--d:.4s"><span class="fl"><svg viewBox="0 0 64 64"><rect x="26" y="3" width="12" height="7" rx="2" fill="url(#g)"/><rect x="30" y="9" width="4" height="6" fill="url(#g)"/><rect x="48" y="12" width="8" height="5" rx="2" fill="url(#g)" transform="rotate(42 52 15)"/><circle cx="32" cy="37" r="23" fill="url(#g)"/><circle cx="32" cy="37" r="17" fill="url(#gl)"/><path d="M32 37V26M32 37l7 5" stroke="#8f6210" stroke-width="3" stroke-linecap="round" fill="none"/></svg></span><span class="cap"></span></button>
      <button class="item" style="--d:.55s"><span class="fl"><svg viewBox="0 0 64 64"><rect x="25" y="4" width="14" height="18" rx="3" fill="url(#g)"/><rect x="27" y="21" width="10" height="9" fill="#5a2340"/><rect x="17" y="29" width="30" height="29" rx="9" fill="url(#r)"/><rect x="23" y="35" width="6" height="16" rx="3" fill="#fff" opacity=".35"/></svg></span><span class="cap"></span></button>
      <button class="item" style="--d:.7s"><span class="fl"><svg viewBox="0 0 64 64"><path d="M5 33C13 21 25 22 32 28C39 22 51 21 59 33C51 49 41 54 32 54C23 54 13 49 5 33Z" fill="url(#r)"/><path d="M7 33C20 39 44 39 57 33" stroke="#7a1830" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M18 41C24 46 30 47 36 47" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".35"/></svg></span><span class="cap"></span></button>
      <button class="item" style="--d:.85s"><span class="fl"><svg viewBox="0 0 64 64"><path d="M32 3 38 26 61 32 38 38 32 61 26 38 3 32 26 26z" fill="url(#g)"/><path d="M52 6l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="url(#g)" opacity=".8"/></svg></span><span class="cap"></span></button>
    </div>

    <section id="finale">
      <p class="serif fx" style="--t:.2s;font-size:24px">Those were only six of the reasons.</p>
      <div class="sig" id="sig"><span class="ink gold">Uday Shankar</span><i class="pen"></i></div>
      <svg class="under" viewBox="0 0 260 14" aria-hidden="true"><path pathLength="1" d="M4 9C60 2 150 14 256 4"/></svg>
      <h3 class="serif gold fx" style="--t:3.8s">Meet me.</h3>
      <p class="fx" style="--t:4.2s">When you are ready, send me this word.</p>
      <div class="code fx" style="--t:4.6s"><span id="word">JAANISACUPCAKE</span><button class="btn" id="cp2">Copy</button></div>
      <p id="st" aria-live="polite"></p>
    </section>
  </section>
</main>

<div id="sheet" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <article class="card" role="dialog" aria-modal="true" aria-labelledby="ct">
    <div class="cico" id="cico"></div>
    <h3 class="serif" id="ct"></h3>
    <p id="cp"></p>
    <div class="acts"><button class="btn" id="nx">Next</button><button class="btn ghost" id="cl">Close</button></div>
  </article>
</div>

<script>
(function(){
  var T=[
    ["Bold, yet sweet.","She’s got the courage to stand tall and a heart soft enough to care deeply. I’ve met many people, but very few with the humility and tenderness that she carries so effortlessly."],
    ["An 80 kg cupcake.","She cares in ways that often go unnoticed. Just because someone cannot recognise her kindness doesn’t mean it isn’t there. She’s a whole lot of boldness wrapped around the sweetest heart."],
    ["My favourite little adventures.","My favourite memories are the simplest ones. Especially all those times I’d find some excuse to distract her and take her out. Somehow, those ordinary moments became some of the most valuable memories I have."],
    ["The woman she’s becoming.","She’s becoming a woman I’d adore for a lifetime. A wonderful sister, a pillar for her family, and someone capable of facing whatever life throws her way. I hope she always sees the incredible person she’s becoming."],
    ["Olave, olave.","There’s something about hearing her sing that makes me feel alive. Especially “Olave, olave.” Some voices are just music to your ears. Hers has a way of reaching somewhere deeper."],
    ["The girl who mutes time.","Being around her makes me forget time and everything happening around me. Ever since day one, she’s had this ability to make the world go quiet. Nobody else has ever done that for me. She’s sweet. She’s kind. And honestly, that’s enough."]
  ];
  var $=function(s){return document.querySelector(s)},
      layer=$('#layer'),stage=$('#stage'),hero=$('#hero'),sheet=$('#sheet'),
      items=[].slice.call(document.querySelectorAll('.item')),dots=[].slice.call(document.querySelectorAll('#dots i')),
      seen={},cur=0,opened=false,done=false;

  function heart(){
    var el=document.createElement('div'),s=14+Math.random()*28;
    el.className='fall';
    el.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(4+Math.random()*4)+'s;--sway:'+(Math.random()*90-45)+'px;--rot:'+(Math.random()*120-60)+'deg';
    el.innerHTML='<svg viewBox="0 0 24 24"><use href="#heart"/></svg>';
    el.addEventListener('animationend',function(){el.remove()});
    layer.appendChild(el);
  }
  function shower(n){for(var i=0;i<n;i++)setTimeout(heart,i*55)}

  $('#open').addEventListener('click',function(){
    if(opened)return; opened=true;
    hero.classList.add('out'); stage.classList.add('go');
    setTimeout(function(){hero.style.display='none'},450);
    shower(70);
    setInterval(function(){if(layer.children.length<35)heart()},300);
    document.addEventListener('click',function(){shower(10)});
  });

  items.forEach(function(b,i){
    b.querySelector('.cap').textContent=T[i][0];
    b.addEventListener('click',function(){show(i)});
  });

  function show(i){
    cur=i; seen[i]=1; items[i].classList.add('seen'); dots[i].classList.add('on');
    $('#cico').innerHTML=items[i].querySelector('svg').outerHTML;
    $('#ct').textContent=T[i][0]; $('#cp').textContent=T[i][1];
    $('#nx').textContent=i<5?'Next':'Done';
    ['#ct','#cp'].forEach(function(s){var e=$(s);e.style.animation='none';void e.offsetWidth;e.style.animation=''});
    sheet.classList.add('on'); sheet.setAttribute('aria-hidden','false'); document.body.classList.add('lock');
    if(navigator.vibrate)navigator.vibrate(12);
  }
  function shut(){
    sheet.classList.remove('on'); sheet.setAttribute('aria-hidden','true'); document.body.classList.remove('lock');
    if(Object.keys(seen).length===6&&!done){done=true;setTimeout(finale,650)}
  }
  function finale(){
    var f=$('#finale'); f.classList.add('on');
    setTimeout(function(){f.scrollIntoView({behavior:'smooth',block:'start'})},120);
    shower(90);
    setTimeout(function(){$('#sig').classList.add('go')},800);
  }
  $('#nx').addEventListener('click',function(e){e.stopPropagation();if(cur<5)show(cur+1);else shut()});
  $('#cl').addEventListener('click',function(e){e.stopPropagation();shut()});
  $('#scrim').addEventListener('click',function(e){e.stopPropagation();shut()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet.classList.contains('on'))shut()});

  function copied(ok){
    $('#st').textContent=ok?'Copied. Now send it to me.':'Press and hold the word to copy it.';
    $('#cp2').textContent=ok?'Copied':'Copy';
  }
  $('#cp2').addEventListener('click',function(){
    var w='JAANISACUPCAKE';
    function fb(){
      try{var t=document.createElement('textarea');t.value=w;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();t.setSelectionRange(0,99);var ok=document.execCommand('copy');t.remove();copied(ok)}catch(e){copied(false)}
    }
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(w).then(function(){copied(true)},fb);else fb();
  });
})();
</script>
</body>
</html>
